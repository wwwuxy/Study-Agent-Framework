<rect x="48" y="136" width="316" height="132" rx="14" fill="#ffffff" stroke="#dde3d6"/>
<text x="70" y="166" font-size="13" font-weight="650" letter-spacing="2" fill="#8e9b81">01</text>
<text x="70" y="201" font-size="23" font-weight="600" fill="#254a37">Set a learning goal</text>
<text x="70" y="235" font-size="16" fill="#697568">Choose your model and daily time</text><rect x="402" y="136" width="316" height="132" rx="14" fill="#ffffff" stroke="#dde3d6"/>
<text x="424" y="166" font-size="13" font-weight="650" letter-spacing="2" fill="#8e9b81">02</text>
<text x="424" y="201" font-size="23" font-weight="600" fill="#254a37">Take a diagnostic</text>
<text x="424" y="235" font-size="16" fill="#697568">Build a baseline with real answers</text><rect x="756" y="136" width="316" height="132" rx="14" fill="#ffffff" stroke="#dde3d6"/>
<text x="778" y="166" font-size="13" font-weight="650" letter-spacing="2" fill="#8e9b81">03</text>
<text x="778" y="201" font-size="23" font-weight="600" fill="#254a37">Study a lesson</text>
<text x="778" y="235" font-size="16" fill="#697568">Retrieve your material evidence first</text><rect x="756" y="309" width="316" height="132" rx="14" fill="#ffffff" stroke="#dde3d6"/>
<text x="778" y="339" font-size="13" font-weight="650" letter-spacing="2" fill="#8e9b81">04</text>
<text x="778" y="374" font-size="23" font-weight="600" fill="#254a37">Practice and get feedback</text>
<text x="778" y="408" font-size="16" fill="#697568">Record answers and assistance</text><rect x="402" y="309" width="316" height="132" rx="14" fill="#ffffff" stroke="#dde3d6"/>
<text x="424" y="339" font-size="13" font-weight="650" letter-spacing="2" fill="#8e9b81">05</text>
<text x="424" y="374" font-size="23" font-weight="600" fill="#254a37">Update learning evidence</text>
<text x="424" y="408" font-size="16" fill="#697568">Estimate knowledge state by rules</text><rect x="48" y="309" width="316" height="132" rx="14" fill="#ffffff" stroke="#dde3d6"/>
<text x="70" y="339" font-size="13" font-weight="650" letter-spacing="2" fill="#8e9b81">06</text>
<text x="70" y="374" font-size="23" font-weight="600" fill="#254a37">Choose the next step</text>
<text x="70" y="408" font-size="16" fill="#697568">Save progress and continue later</text><rect x="48" y="480" width="1024" height="84" rx="14" fill="#e9eee0"/>
<text x="72" y="514" font-size="20" font-weight="550" fill="#36523a">Your PDF → Your remote model → Chapters, concepts and citations</text>
<text x="72" y="544" font-size="16" fill="#687667">No local document extraction. No local embedding models.</text></g></svg>
