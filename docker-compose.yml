services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_agent
      POSTGRES_USER: study_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_agent -d study_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://study_agent:${POSTGRES_PASSWORD}@db:5432/study_agent
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENABLE_FAKE_PROVIDER: ${ENABLE_FAKE_PROVIDER:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8000}
      ALLOW_PRIVATE_PROVIDER_URLS: ${ALLOW_PRIVATE_PROVIDER_URLS:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
